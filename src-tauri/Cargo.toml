[package]
name = "blink"
version = "0.1.0"
description = "Blink — design animated 2D characters and export them as Vue components"
edition = "2021"

[lib]
name = "blink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
